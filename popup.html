<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>页伴翻译</title></head>
<body class="popup-body">
  <main class="popup-shell">
    <header class="popup-header">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 40 44" fill="none" aria-hidden="true"><path d="M7 5h19l8 8v26H7V5Z" fill="currentColor" opacity=".12"/><path d="M7 5h19l8 8v26H7V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M25 5v9h9M13 20h15M13 26h15M13 32h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><div><span class="brand-name">页伴翻译</span><span class="brand-en">YEBAN TRANSLATE</span></div></div>
      <button id="open-settings" class="settings-button" type="button" aria-label="打开设置" title="打开设置"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9.5 3-.6 2.1-2 .9-2-.6-2.4 4.2L4 11v2l-1.5 1.4L4.9 19l2-.6 2 .9.6 2.1h5l.6-2.1 2-.9 2 .6 2.4-4.2L20 13v-2l1.5-1.4L19.1 5l-2 .6-2-.9L14.5 3h-5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </header>
    <p class="popup-intro">让语言退后一步，让阅读自然发生。</p>
    <section id="data-notice" class="notice" hidden aria-labelledby="notice-title"><h2 id="notice-title" style="font-size:13px">开始之前，了解文本如何使用</h2><p>待翻译的正文或选中文字会发送给你选择的翻译服务，可能产生 API 用量费用。凭据仅保存在本机扩展中。</p><button id="accept-notice" type="button" class="primary">我了解并同意</button></section>
    <div class="popup-form">
      <div class="language-pair"><div><label for="source">原文语言</label><select id="source"><option value="auto">自动识别</option><option value="en">英文</option><option value="zh">中文</option></select></div><span class="language-arrow" aria-hidden="true">→</span><div><label for="target">翻译为</label><select id="target"><option value="zh">简体中文</option><option value="en">英文</option></select></div></div>
      <div><button id="start" type="button" class="primary popup-main-action" disabled>翻译当前页面</button><div class="popup-secondary"><button id="stop" type="button" disabled>停止翻译</button><button id="restore" type="button" disabled>恢复原文</button><button id="retry" type="button" disabled>重试失败段落</button></div></div>
    </div>
    <section class="popup-status" aria-live="polite" aria-atomic="true"><p class="status-title"><span id="status-dot" class="status-dot" aria-hidden="true"></span><span id="status-title">正在读取当前页</span></p><p id="status-detail" class="status-detail">页面状态会在这里显示。</p></section>
    <div id="action-feedback" class="feedback" role="status" aria-live="polite" hidden></div>
    <button id="open-sidepanel" type="button" class="panel-open-button" aria-describedby="sidepanel-hint" disabled><span id="sidepanel-label">正在读取侧栏状态…</span><span aria-hidden="true">↗</span></button><p id="sidepanel-hint" class="field-hint" role="status">正在确认当前窗口的侧栏状态，请稍候。</p>
    <section class="popup-site"><span class="site-icon" aria-hidden="true">译</span><div class="site-copy"><h2>划词翻译</h2><p id="site-host" class="site-host">读取当前网站…</p></div><button id="site-toggle" class="site-action" type="button" disabled>在此网站启用划词</button></section>
    <p id="site-feature-hint" class="field-hint"></p><div id="all-sites-guide" class="notice compact-notice" hidden><p>划词功能默认开启。完成一次网站授权，即可在网页使用划词与悬浮球。</p><button id="grant-all-sites" type="button">在所有网站启用划词和悬浮球</button></div>
    <footer class="popup-footer"><span>双语对照 · 随读随译</span><span>V0.2.9 · 自带 API</span></footer>
  </main>
  <script type="module" src="/src/popup/index.ts"></script>
</body>
</html>
