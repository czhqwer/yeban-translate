<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>文本翻译 · 页伴翻译</title></head>
<body class="sidepanel-body">
  <main class="sidepanel-shell">
    <header class="panel-header"><h1>文本翻译</h1><button id="panel-settings" type="button" class="subtle compact-button">设置</button></header>
    <section id="panel-setup" class="notice" hidden><h2 id="panel-setup-title">先完成翻译设置</h2><p id="panel-setup-detail"></p><button id="panel-setup-button" type="button">查看数据使用说明</button></section>
    <div class="panel-controls">
      <div class="panel-language-row"><select id="panel-source" aria-label="原文语言"><option value="auto">自动识别</option><option value="en">英文</option><option value="zh">中文</option></select><span class="language-arrow" aria-hidden="true">→</span><select id="panel-target" aria-label="翻译为"><option value="zh">简体中文</option><option value="en">英文</option></select></div>
    </div>
    <section class="panel-input-section"><div class="section-heading"><label for="panel-input">原文</label><span id="panel-count" aria-live="polite">0 / 2000 字符</span></div><textarea id="panel-input" rows="7" spellcheck="false" placeholder="输入或粘贴文本…" aria-describedby="panel-count panel-input-hint"></textarea><p id="panel-input-hint" class="field-hint" hidden></p></section>
    <div class="panel-main-actions"><button id="panel-translate" type="button" class="primary" disabled>翻译文本</button><button id="panel-stop" type="button" disabled>停止</button><button id="panel-clear" type="button">清空</button></div>
    <div id="panel-feedback" class="feedback" role="status" aria-live="polite" hidden></div>
    <section class="panel-result-section" aria-labelledby="panel-result-title"><div class="section-heading"><h2 id="panel-result-title">译文</h2><button id="panel-copy" type="button" class="compact-button" disabled>复制译文</button></div><div id="panel-output" class="panel-output" aria-live="polite" aria-busy="false"><p id="panel-empty" class="caption" hidden></p><p id="panel-translated" hidden></p></div><div id="panel-result-footer" class="panel-result-footer" hidden><p id="panel-result-meta" class="field-hint"></p><button id="panel-retry" type="button" class="compact-button" title="沿用此次文本和目标语言重试" hidden>重试</button></div></section>
    <footer class="sidepanel-quote" aria-label="页伴寄语">跨过语言，抵达文字本身。</footer>
  </main>
  <script type="module" src="/src/sidepanel/index.ts"></script>
</body>
</html>
