<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页伴翻译 · 文本翻译</title></head>
<body class="sidepanel-body">
  <main class="sidepanel-shell">
    <header class="panel-header"><h1>文本翻译</h1><button id="panel-settings" class="subtle compact-button" type="button">设置</button></header>
    <section id="panel-setup" class="notice" hidden><h2 id="panel-setup-title"></h2><p id="panel-setup-detail"></p><button id="panel-setup-button" type="button">查看数据使用说明</button></section>
    <div class="panel-controls"><div class="panel-language-row"><select id="panel-source" aria-label="原文语言"></select><span class="language-arrow" aria-hidden="true">→</span><select id="panel-target" aria-label="翻译为"></select></div></div>
    <section class="panel-input-section">
      <div class="section-heading"><label for="panel-input">原文</label><span id="panel-count" aria-live="polite">0 / 2000 字符</span></div>
      <textarea id="panel-input" rows="7" spellcheck="false" placeholder="输入文本，或按 Ctrl+V 粘贴截图…" aria-describedby="panel-count panel-input-hint"></textarea>
      <div id="image-attachment" class="image-attachment" hidden><img id="image-preview" alt="待翻译的粘贴图片"><div><p>已粘贴图片</p><p class="field-hint">点击翻译会将此图片发送至设置中的百炼模型。未指定语言时自动中英互译。</p><button id="image-remove" type="button" class="compact-button">移除图片</button></div></div>
      <p id="panel-input-hint" class="field-hint" hidden></p>
    </section>
    <div class="panel-main-actions"><button id="panel-translate" type="button" class="primary" disabled>翻译文本</button><button id="panel-stop" type="button" disabled>停止</button><button id="panel-clear" type="button">清空</button></div>
    <div id="panel-feedback" class="feedback" role="status" aria-live="polite" hidden></div>
    <section class="panel-result-section" aria-labelledby="panel-result-title"><div class="section-heading"><h2 id="panel-result-title">译文</h2><button id="panel-copy" type="button" class="compact-button" disabled>复制译文</button></div><div id="panel-output" class="panel-output" aria-live="polite" aria-busy="false"><p id="panel-empty" class="caption" hidden></p><p id="panel-translated" hidden></p></div><div id="panel-result-footer" class="panel-result-footer" hidden><p id="panel-result-meta" class="field-hint"></p><button id="panel-retry" type="button" class="compact-button" title="沿用此次内容和目标语言重试" hidden>重试</button></div></section>
    <footer class="sidepanel-quote" aria-label="页伴寄语">跨过语言，抵达文字本身。</footer>
  </main>
  <script type="module" src="/src/sidepanel/index.ts"></script>
</body>
</html>
